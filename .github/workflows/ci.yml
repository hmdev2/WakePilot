name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: "**/packages.lock.json"

      - name: Restore locked dependencies
        run: dotnet restore RemoteWake.slnx --locked-mode

      - name: Verify formatting
        run: dotnet format RemoteWake.slnx --verify-no-changes --no-restore

      - name: Build
        run: dotnet build RemoteWake.slnx --configuration Release --no-restore

      - name: Test domain with coverage gate
        run: dotnet test tests/Unit/RemoteWake.Domain.Tests/RemoteWake.Domain.Tests.csproj --configuration Release --no-build --no-restore -p:CollectCoverage=true -p:Threshold=80 -p:ThresholdType=line -p:ThresholdStat=total -p:Include="[RemoteWake.Domain]*"

      - name: Test application with coverage gate
        run: dotnet test tests/Unit/RemoteWake.Application.Tests/RemoteWake.Application.Tests.csproj --configuration Release --no-build --no-restore -p:CollectCoverage=true -p:Threshold=70 -p:ThresholdType=line -p:ThresholdStat=total -p:Include="[RemoteWake.Application]*"

      - name: Audit vulnerable packages
        run: dotnet list RemoteWake.slnx package --vulnerable --include-transitive
